

[manifest]
version = "1.0.0"
dump_lua = true
priority = 200

[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/card_draw.lua"]'
match_indent = true
position = 'before'
pattern = '''local seal = G.P_SEALS[self.seal] or {}'''
payload = '''if Mace.is_using_skin(self) and Mace.seal_to_atlas_pos[self.seal] then return end'''


[[patches]]
[patches.pattern]
target = '=[SMODS _ "src/card_draw.lua"]'
match_indent = true
position = 'at'
pattern = '''focused_ui = true, front = true, back = true, soul_parts = true, center = true, floating_sprite = true, shadow = true, use_button = true, buy_button = true, buy_and_use_button = true, debuff = true, price = true, particles = true, h_popup = true,'''
payload = '''focused_ui = true, front = true, back = true, soul_parts = true, center = true, floating_sprite = true, shadow = true, use_button = true, buy_button = true, buy_and_use_button = true, debuff = true, price = true, particles = true, h_popup = true, enhancement_sprite = true, front_sprite = true, seal_sprite = true,'''
